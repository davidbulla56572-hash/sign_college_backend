services:
  postgres:
    image: postgres:16-alpine
    container_name: sign_college_postgres
    environment:
      POSTGRES_DB: sign_college
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sign_college_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sign_college"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sign_college_pgdata:
